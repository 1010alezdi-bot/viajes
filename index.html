<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro de Viajes</title>
    <style>
        :root {
            --bg: #f2f3f5; --surface: #fff; --surface-alt: #f8f9fb;
            --text: #111827; --text-secondary: #6b7280; --border: #e5e7eb;
            --primary: #1e40af; --success: #047857; --warning: #b45309; --danger: #b91c1c;
            --radius: 8px; --radius-lg: 12px; --shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }
        .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 16px; height: 52px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .topbar-brand { font-size: 1rem; font-weight: 700; }
        .topbar-date { font-size: 0.75rem; color: var(--text-secondary); }
        .container { max-width: 880px; margin: 0 auto; padding: 16px 12px; }
        .nav { display: flex; gap: 0; margin-bottom: 20px; background: var(--surface); border-radius: var(--radius-lg); padding: 4px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .nav-btn { flex: 1; padding: 10px 14px; text-align: center; border-radius: var(--radius); cursor: pointer; font-weight: 500; font-size: 0.8rem; border: none; background: transparent; font-family: inherit; color: var(--text-secondary); }
        .nav-btn.active { background: var(--text); color: white; font-weight: 600; }
        .card { background: var(--surface); border-radius: var(--radius-lg); padding: 20px 16px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .card-emphasis { border-left: 4px solid var(--primary); }
        .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
        .section-header .indicator { width: 4px; height: 22px; background: var(--primary); border-radius: 2px; }
        .section-title { font-size: 1rem; font-weight: 700; }
        .field-group { margin-bottom: 14px; }
        .field-label { display: block; font-size: 0.72rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; }
        .field-input, .field-select { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: 0.9rem; background: var(--surface-alt); font-family: inherit; }
        .field-input:focus, .field-select:focus { outline: none; border-color: var(--primary); background: white; }
        .field-input.readonly { background: #eff6ff; font-weight: 600; color: var(--primary); font-size: 1rem; border-color: #dbeafe; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 13px 20px; border: none; border-radius: var(--radius); font-size: 0.875rem; font-weight: 600; cursor: pointer; width: 100%; font-family: inherit; }
        .btn-primary { background: var(--text); color: white; }
        .btn-sm { padding: 8px 14px; font-size: 0.78rem; width: auto; }
        .btn-danger { background: var(--surface); color: var(--danger); border: 1.5px solid #fecaca; }
        .btn-outline { background: var(--surface); color: var(--text); border: 1.5px solid var(--border); }
        .result-box { background: linear-gradient(135deg, #ecfdf5, #d1fae5); border: 1.5px solid #a7f3d0; border-radius: var(--radius); padding: 20px 24px; margin-top: 16px; }
        .result-label { font-size: 0.68rem; font-weight: 700; color: #065f46; text-transform: uppercase; }
        .result-amount { font-size: 2rem; font-weight: 800; color: #065f46; }
        .result-detail { font-size: 0.75rem; color: #047857; margin-top: 4px; }
        .table-container { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); background: white; }
        .table-historial { width: 100%; border-collapse: collapse; font-size: 0.78rem; min-width: 650px; }
        .table-historial thead th { background: #f8f9fb; padding: 10px 8px; text-align: center; font-weight: 700; font-size: 0.65rem; text-transform: uppercase; color: var(--text-secondary); border-bottom: 2px solid #e5e7eb; }
        .table-historial tbody td { padding: 10px 8px; text-align: center; border-bottom: 1px solid #f3f4f6; }
        .table-historial tbody tr:nth-child(even) { background: #fcfcfd; }
        .cell-amount { font-weight: 700; color: var(--success); }
        .type-badge { display: inline-block; padding: 3px 8px; border-radius: 100px; font-size: 0.65rem; font-weight: 600; }
        .type-normal { background: #ecfdf5; color: #065f46; }
        .type-extra { background: #fef2f2; color: #991b1b; }
        .summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
        @media (min-width: 500px) { .summary { grid-template-columns: repeat(4, 1fr); } }
        .summary-card { background: var(--surface); padding: 14px 12px; border-radius: var(--radius); text-align: center; border: 1px solid var(--border); }
        .summary-value { font-size: 1.2rem; font-weight: 800; }
        .summary-label { font-size: 0.65rem; color: var(--text-secondary); text-transform: uppercase; }
        .hidden { display: none; }
        .flex-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
        .notif { position: fixed; bottom: 20px; right: 20px; background: #111827; color: white; padding: 12px 16px; border-radius: var(--radius); font-size: 0.82rem; font-weight: 500; z-index: 999; animation: fadeIn 0.3s ease; }
        .notif.success { border-left: 3px solid #10b981; }
        .notif.warning { border-left: 3px solid #f59e0b; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 400px) { .field-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-brand">Registro de Viajes</div>
    <div class="topbar-date" id="fechaActual"></div>
</div>

<div class="container">
    <nav class="nav">
        <button class="nav-btn active" onclick="showTab('viaje')">Nuevo</button>
        <button class="nav-btn" onclick="showTab('tarifas')">Tarifas</button>
        <button class="nav-btn" onclick="showTab('historial')">Historial</button>
    </nav>

    <div id="tab-viaje">
        <div class="card card-emphasis">
            <div class="section-header"><div class="indicator"></div><div class="section-title">Registrar Viaje</div></div>
            <div class="field-group"><label class="field-label">Fecha</label><input type="date" class="field-input readonly" id="fecha" readonly></div>
            <div class="field-group"><label class="field-label">Ruta</label><input type="text" class="field-input" id="ruta" placeholder="Origen y destino"></div>
            <div class="field-row">
                <div class="field-group"><label class="field-label">Km Inicial</label><input type="text" class="field-input" id="kmInicial" placeholder="0" inputmode="numeric" oninput="formatearKMInput('kmInicial'); calcular();"></div>
                <div class="field-group"><label class="field-label">Km Final</label><input type="text" class="field-input" id="kmFinal" placeholder="0" inputmode="numeric" oninput="formatearKMInput('kmFinal'); calcular();"></div>
            </div>
            <div class="field-group"><label class="field-label">Km Recorridos</label><input type="text" class="field-input readonly" id="kmRecorridos" readonly value="0"></div>
            <div class="field-group"><label class="field-label">Tipo</label><select class="field-select" id="tipoViaje" onchange="calcular()"><option value="normal">Normal</option><option value="extra">Extra (2ª/3ª)</option></select></div>
            <div class="result-box" id="resultBox" style="display:none;"><div class="result-label">Total a Cobrar</div><div class="result-amount" id="montoTotal">$0,00</div><div class="result-detail" id="detalleCalculo"></div></div>
            <button class="btn btn-primary" style="margin-top:14px" onclick="guardarViaje()">Registrar Viaje</button>
        </div>
    </div>

    <div id="tab-tarifas" class="hidden">
        <div class="card">
            <div class="section-header"><div class="indicator"></div><div class="section-title">Tarifas</div></div>
            <div style="overflow-x:auto;">
            <table style="width:100%;font-size:0.8rem;border-collapse:collapse;">
                <thead><tr style="background:#f8f9fb;"><th style="padding:10px;text-align:left;">Tramo</th><th style="padding:10px;">Desde</th><th style="padding:10px;">Hasta</th><th style="padding:10px;">Tarifa</th></tr></thead>
                <tbody>
                    <tr><td style="padding:10px;"><strong>Tramo 1</strong></td><td style="padding:10px;">0 km</td><td style="padding:10px;"><input type="number" id="t1_hasta" value="120" style="width:80px;" onchange="guardarTarifas()"> km</td><td style="padding:10px;">$ <input type="number" id="t1_tarifa" value="86824.60" step="0.01" style="width:110px;" onchange="guardarTarifas()"></td></tr>
                    <tr><td style="padding:10px;"><strong>Tramo 2</strong></td><td id="t2_desde" style="padding:10px;">121 km</td><td style="padding:10px;"><input type="number" id="t2_hasta" value="240" style="width:80px;" onchange="guardarTarifas()"> km</td><td style="padding:10px;">$ <input type="number" id="t2_tarifa" value="130216.29" step="0.01" style="width:110px;" onchange="guardarTarifas()"></td></tr>
                    <tr><td style="padding:10px;"><strong>Tramo 3</strong></td><td id="t3_desde" style="padding:10px;">241 km</td><td style="padding:10px;"><input type="number" id="t3_hasta" value="479" style="width:80px;" onchange="guardarTarifas()"> km</td><td style="padding:10px;">$ <input type="number" id="t3_tarifa" value="173621.72" step="0.01" style="width:110px;" onchange="guardarTarifas()"></td></tr>
                    <tr style="background:#fffbeb;"><td style="padding:10px;"><strong>Tramo 4</strong></td><td id="t4_desde" style="padding:10px;">480 km</td><td style="padding:10px;">en adelante</td><td style="padding:10px;">$ <input type="number" id="t4_tarifa" value="217027.13" step="0.01" style="width:110px;" onchange="guardarTarifas()"></td></tr>
                </tbody>
            </table>
            </div>
            <div style="margin-top:12px;">Adicional km (Tramo 4): $ <input type="number" id="adicionalKm" value="320.50" step="0.01" style="width:110px;" onchange="guardarTarifas()"> / km</div>
            <div style="margin-top:8px;">Viaje Extra: $ <input type="number" id="tarifaExtra" value="43405.43" step="0.01" style="width:110px;" onchange="guardarTarifas()"> fijo</div>
        </div>
    </div>

    <div id="tab-historial" class="hidden">
        <div class="card">
            <div class="section-header"><div class="indicator"></div><div class="section-title">Historial</div></div>
            <div class="summary" id="resumenHistorial"></div>
            <div class="table-container"><table class="table-historial"><thead><tr><th>#</th><th>Fecha</th><th>Ruta</th><th>Km Ini</th><th>Km Fin</th><th>Km Rec</th><th>Tipo</th><th>Importe</th></tr></thead><tbody id="cuerpoHistorial"></tbody></table></div>
            <div class="flex-row"><button class="btn btn-danger btn-sm" onclick="limpiarHistorial()">Eliminar</button><button class="btn btn-outline btn-sm" onclick="exportarHistorial()">Exportar Excel</button></div>
        </div>
    </div>
</div>

<script>
const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbzQMVs1rdsYMVBtSdZ-1L0QulhQs67vAEHvxw0UKXAANFr_XpgEJPGl2YPygrcl9F0b/exec';

const TARIFAS = {
    tramo1_hasta: 120, tramo1_tarifa: 86824.60,
    tramo2_hasta: 240, tramo2_tarifa: 130216.29,
    tramo3_hasta: 479, tramo3_tarifa: 173621.72,
    tramo4_tarifa: 217027.13, adicionalKm: 320.50, tarifaExtra: 43405.43
};

let historial = [];

function notificar(m, t) {
    const n = document.createElement('div');
    n.className = 'notif ' + (t || 'success');
    n.textContent = m;
    document.body.appendChild(n);
    setTimeout(() => n.remove(), 4000);
}

function fmtM(n) { return new Intl.NumberFormat('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: true }).format(n); }
function fmtK(n) { return new Intl.NumberFormat('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0, useGrouping: true }).format(n); }
function toK(t) { if (!t) return 0; return parseFloat(t.replace(/\./g, '')) || 0; }

function formatearKMInput(c) {
    const i = document.getElementById(c);
    const n = i.value.replace(/\D/g, '');
    if (!n) { i.value = ''; return; }
    i.value = fmtK(parseInt(n));
}

function getTarifas() {
    const g = localStorage.getItem('tarifas');
    return g ? JSON.parse(g) : TARIFAS;
}

function guardarTarifas() {
    const t = {
        tramo1_hasta: +document.getElementById('t1_hasta').value || 0,
        tramo1_tarifa: +document.getElementById('t1_tarifa').value || 0,
        tramo2_hasta: +document.getElementById('t2_hasta').value || 0,
        tramo2_tarifa: +document.getElementById('t2_tarifa').value || 0,
        tramo3_hasta: +document.getElementById('t3_hasta').value || 0,
        tramo3_tarifa: +document.getElementById('t3_tarifa').value || 0,
        tramo4_tarifa: +document.getElementById('t4_tarifa').value || 0,
        adicionalKm: +document.getElementById('adicionalKm').value || 0,
        tarifaExtra: +document.getElementById('tarifaExtra').value || 0
    };
    localStorage.setItem('tarifas', JSON.stringify(t));
    calcular();
}

function calcMonto(km, tipo) {
    const t = getTarifas();
    if (tipo === 'extra') return t.tarifaExtra;
    if (km <= t.tramo1_hasta) return t.tramo1_tarifa;
    if (km <= t.tramo2_hasta) return t.tramo2_tarifa;
    if (km <= t.tramo3_hasta) return t.tramo3_tarifa;
    return t.tramo4_tarifa + ((km - t.tramo3_hasta) * t.adicionalKm);
}

function calcular() {
    const ki = toK(document.getElementById('kmInicial').value);
    const kf = toK(document.getElementById('kmFinal').value);
    const tipo = document.getElementById('tipoViaje').value;
    const kr = kf > ki ? kf - ki : 0;
    document.getElementById('kmRecorridos').value = fmtK(kr);
    const rb = document.getElementById('resultBox');
    if (kr <= 0) { rb.style.display = 'none'; return; }
    rb.style.display = 'block';
    const m = calcMonto(kr, tipo);
    document.getElementById('montoTotal').textContent = '$' + fmtM(m);
    document.getElementById('detalleCalculo').textContent = tipo === 'extra' ? 'Tarifa extra' : 'Km: ' + fmtK(kr);
}

async function guardarViaje() {
    const ruta = document.getElementById('ruta').value.trim();
    const ki = toK(document.getElementById('kmInicial').value);
    const kf = toK(document.getElementById('kmFinal').value);
    const kr = toK(document.getElementById('kmRecorridos').value);
    const tipo = document.getElementById('tipoViaje').value;
    if (!ruta) { notificar('Ingrese la ruta', 'warning'); return; }
    if (kr <= 0) { notificar('Km Final > Km Inicial', 'warning'); return; }
    const monto = calcMonto(kr, tipo);
    const viaje = { id: Date.now(), fecha: document.getElementById('fecha').value, ruta, kmInicial: ki, kmFinal: kf, kmRecorridos: kr, tipoViaje: tipo, monto };

    try {
        await fetch(URL_SCRIPT, {
            method: 'POST',
            body: JSON.stringify({ action: 'guardar', viaje: viaje }),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
    } catch (e) {}

    historial.unshift(viaje);
    localStorage.setItem('historial', JSON.stringify(historial));
    document.getElementById('ruta').value = '';
    document.getElementById('kmInicial').value = '';
    document.getElementById('kmFinal').value = '';
    document.getElementById('kmRecorridos').value = '0';
    document.getElementById('resultBox').style.display = 'none';
    notificar('Viaje registrado - $' + fmtM(monto));
    mostrarHistorial();
}

function mostrarHistorial() {
    const d = localStorage.getItem('historial');
    historial = d ? JSON.parse(d) : [];
    const tbody = document.getElementById('cuerpoHistorial');
    const resumen = document.getElementById('resumenHistorial');
    if (!historial.length) {
        tbody.innerHTML = ''; resumen.innerHTML = '';
        return;
    }
    const tm = historial.reduce((s, v) => s + v.monto, 0);
    const tk = historial.reduce((s, v) => s + v.kmRecorridos, 0);
    resumen.innerHTML = `<div class="summary-card"><div class="summary-label">Viajes</div><div class="summary-value">${historial.length}</div></div><div class="summary-card"><div class="summary-label">Facturación</div><div class="summary-value">$${fmtM(tm)}</div></div><div class="summary-card"><div class="summary-label">Km Totales</div><div class="summary-value">${fmtK(tk)}</div></div>`;
    tbody.innerHTML = historial.map((v, i) => `<tr><td>${historial.length-i}</td><td>${v.fecha.split('-').reverse().join('/')}</td><td>${v.ruta}</td><td>${fmtK(v.kmInicial)}</td><td>${fmtK(v.kmFinal)}</td><td>${fmtK(v.kmRecorridos)}</td><td><span class="type-badge ${v.tipoViaje==='extra'?'type-extra':'type-normal'}">${v.tipoViaje==='extra'?'Extra':'Normal'}</span></td><td class="cell-amount">$${fmtM(v.monto)}</td></tr>`).join('');
}

function limpiarHistorial() {
    if (confirm('¿Eliminar todo?')) {
        localStorage.removeItem('historial');
        historial = [];
        mostrarHistorial();
    }
}

function exportarHistorial() {
    if (!historial.length) return;
    let csv = 'Fecha,Ruta,Km Inicial,Km Final,Km Recorridos,Tipo,Importe\n';
    historial.forEach(v => { csv += `${v.fecha},${v.ruta},${v.kmInicial},${v.kmFinal},${v.kmRecorridos},${v.tipoViaje},${v.monto}\n`; });
    const b = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'viajes.csv';
    a.click();
}

function showTab(t) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('[id^="tab-"]').forEach(d => d.classList.add('hidden'));
    document.querySelectorAll('.nav-btn')[t==='viaje'?0:t==='tarifas'?1:2].classList.add('active');
    document.getElementById('tab-'+t).classList.remove('hidden');
    if (t === 'historial') mostrarHistorial();
}

document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
document.getElementById('fechaActual').textContent = new Date().toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric', month: 'short' });
cargarTarifas();
mostrarHistorial();

function cargarTarifas() {
    const g = localStorage.getItem('tarifas');
    const t = g ? JSON.parse(g) : TARIFAS;
    document.getElementById('t1_hasta').value = t.tramo1_hasta;
    document.getElementById('t1_tarifa').value = t.tramo1_tarifa;
    document.getElementById('t2_hasta').value = t.tramo2_hasta;
    document.getElementById('t2_tarifa').value = t.tramo2_tarifa;
    document.getElementById('t3_hasta').value = t.tramo3_hasta;
    document.getElementById('t3_tarifa').value = t.tramo3_tarifa;
    document.getElementById('t4_tarifa').value = t.tramo4_tarifa;
    document.getElementById('adicionalKm').value = t.adicionalKm;
    document.getElementById('tarifaExtra').value = t.tarifaExtra;
}
</script>
</body>
</html>
